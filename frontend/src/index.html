<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Gestor de Tareas</h1>
    <span id="env-badge" class="badge">...</span>
  </header>

  <main>
    <section class="stats" aria-label="Indicadores">
      <div class="stat"><span id="stat-total">0</span><small>Total</small></div>
      <div class="stat"><span id="stat-pending">0</span><small>Pendientes</small></div>
      <div class="stat"><span id="stat-done">0</span><small>Completadas</small></div>
      <div class="stat"><span id="stat-overdue">0</span><small>Vencidas</small></div>
      <div class="stat"><span id="stat-rate">0%</span><small>Avance</small></div>
    </section>

    <form id="task-form" class="card">
      <h2>Nueva tarea</h2>
      <label for="title">Título</label>
      <input id="title" name="title" type="text" maxlength="120" required>

      <label for="description">Descripción</label>
      <textarea id="description" name="description" rows="2" maxlength="1000"></textarea>

      <div class="row">
        <div>
          <label for="priority">Prioridad</label>
          <select id="priority" name="priority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
          </select>
        </div>
        <div>
          <label for="due-date">Fecha límite</label>
          <input id="due-date" name="due_date" type="date">
        </div>
      </div>
      <button id="submit-btn" type="submit">Agregar tarea</button>
      <p id="message" role="status"></p>
    </form>

    <section class="card">
      <div class="list-header">
        <h2>Tareas</h2>
        <label for="filter-status" class="sr-only">Filtrar por estado</label>
        <select id="filter-status">
          <option value="">Todas</option>
          <option value="pending">Pendientes</option>
          <option value="done">Completadas</option>
        </select>
      </div>
      <ul id="task-list"></ul>
      <p id="empty-msg">No hay tareas.</p>
    </section>
  </main>

  <footer>Versión desplegada: <span id="app-version">...</span></footer>

  <script src="app.js"></script>
</body>
</html>
