# Ambiente local y de CI: reproduce la arquitectura de AWS
# (Nginx = frontend + papel del ALB, backend = API, db = RDS PostgreSQL).
# Uso: docker compose up -d --build   ->   http://localhost:8080

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tareas
      POSTGRES_USER: tareas
      # La contraseña viene de la variable DB_PASSWORD (archivo .env en local,
      # contraseña aleatoria en el pipeline); no se escribe en el repositorio.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tareas -d tareas"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ${BACKEND_IMAGE:-gestor-tareas-backend:local}
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DB_HOST: db
      DB_NAME: tareas
      DB_USER: tareas
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      APP_VERSION: ${APP_VERSION:-local}
      ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:-gestor-tareas-backend:local}
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${FRONTEND_IMAGE:-gestor-tareas-frontend:local}
    build: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
