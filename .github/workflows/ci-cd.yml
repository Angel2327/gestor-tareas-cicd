# Pipeline CI/CD - Gestor de Tareas
#
# Estrategia de ramas: Trunk-Based Development
#   - feature/* (ramas cortas) -> Pull Request a main  => solo CI (build-and-test)
#   - push/merge a main                                 => CI + Release + CD completo
#
# CI: Checkout -> Build -> Test (estáticas, seguridad, unitarias+cobertura, e2e) -> Release (ECR)
# CD: IaC -> Deploy Infra -> Deploy App -> Tests Pre-Prod (Staging)
#     -> Aprobación manual -> Deploy Infra -> Deploy App -> Smoke Post-Prod (Producción)
#     -> Rollback automático si fallan las pruebas (y manual en rollback.yml)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez; en PRs se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.13"
  TF_VERSION: "1.17.2"
  TRIVY_VERSION: v0.69.3
  BACKEND_LOCAL_IMAGE: gestor-tareas-backend:${{ github.sha }}
  FRONTEND_LOCAL_IMAGE: gestor-tareas-frontend:${{ github.sha }}

jobs:
  # ===========================================================================
  # CI 1. Build + Test (corre en PRs y en main)
  # ===========================================================================
  build-and-test: # No cambiar el nombre: lo exige la regla de protección de main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud usa el historial para detectar código nuevo

      - name: Generar contraseña temporal para la BD del stack local
        run: |
          DB_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies (versiones bloqueadas y verificadas por hash)
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      # ---------------- Pruebas estáticas (calidad) ----------------
      - name: Black (formato)
        run: black --check --config backend/pyproject.toml backend tests

      - name: Pylint (linter, nota mínima 9)
        env:
          PYTHONPATH: backend
        run: |
          pylint backend/app --rcfile=backend/pyproject.toml --fail-under=9 \
            --output-format=parseable | tee pylint-report.txt

      - name: Flake8 (linter)
        run: |
          flake8 backend/app backend/tests tests --config backend/.flake8 \
            --tee --output-file=flake8-report.txt

      # ---------------- Seguridad (DevSecOps) ----------------
      - name: Bandit (SAST - falla con hallazgos de severidad media o alta)
        run: |
          bandit -c backend/pyproject.toml -r backend/app -f json -o bandit-report.json --exit-zero
          bandit -c backend/pyproject.toml -r backend/app -ll

      - name: Trivy (dependencias y secretos en el repositorio)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy (configuración de IaC - Terraform y Dockerfiles, informativo)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          output: trivy-iac-report.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt y validate
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/registry infra/app; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # ---------------- Pruebas unitarias y de componente ----------------
      - name: Pruebas unitarias y de componente (cobertura >= 80 %)
        working-directory: backend
        run: pytest

      # ---------------- Build de las imágenes ----------------
      - name: Build Docker images
        run: |
          docker build -t "$BACKEND_LOCAL_IMAGE" backend
          docker build -t "$FRONTEND_LOCAL_IMAGE" frontend

      - name: Trivy (imagen backend)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.BACKEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy (imagen frontend)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.FRONTEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---------------- Pruebas de integración / aceptación ----------------
      - name: Levantar el stack completo (Nginx + API + PostgreSQL)
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_LOCAL_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_LOCAL_IMAGE }}
          APP_VERSION: ${{ github.sha }}
        run: |
          docker compose up -d --no-build
          bash scripts/wait_for_version.sh http://localhost:8080 "${{ github.sha }}" 120

      - name: Pruebas de humo, API e2e y aceptación (Selenium) contra el stack local
        env:
          APP_BASE_URL: http://localhost:8080
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          pytest tests/smoke tests/api tests/acceptance \
            --html=e2e-report.html --self-contained-html

      - name: Logs del stack si algo falla
        if: failure()
        run: docker compose logs

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/htmlcov/
            backend/report.html
            backend/coverage.xml
            e2e-report.html
            pylint-report.txt
            flake8-report.txt
            bandit-report.json
            trivy-iac-report.txt

      - name: SonarCloud Scan (Quality Gate)
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Build once: las mismas imágenes probadas viajan al job de Release
      - name: Guardar imágenes probadas
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "$BACKEND_LOCAL_IMAGE" "$FRONTEND_LOCAL_IMAGE" -o images.tar

      - name: Upload images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docker-images
          path: images.tar
          retention-days: 1

  # ===========================================================================
  # CI 2. Release: IaC del registro (ECR) + publicación de las imágenes
  # ===========================================================================
  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.push.outputs.backend_image }}
      frontend_image: ${{ steps.push.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: docker-images

      - name: Load images
        run: docker load -i images.tar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: IaC - Terraform Apply del registro (ECR)
        working-directory: infra/registry
        run: |
          terraform init -input=false -backend-config=../backend.hcl
          terraform apply -auto-approve -input=false
          {
            echo "BACKEND_REPO=$(terraform output -raw backend_repository_url)"
            echo "FRONTEND_REPO=$(terraform output -raw frontend_repository_url)"
          } >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push images (etiqueta = SHA, inmutable)
        id: push
        run: |
          push() {
            local local_image="$1" repo="$2"
            local name="${repo##*/}"
            if aws ecr describe-images --repository-name "$name" \
                 --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
              echo "$repo:$GITHUB_SHA ya existe (re-ejecución); no se vuelve a subir"
            else
              docker tag "$local_image" "$repo:$GITHUB_SHA"
              docker push "$repo:$GITHUB_SHA"
            fi
          }
          push "$BACKEND_LOCAL_IMAGE" "$BACKEND_REPO"
          push "$FRONTEND_LOCAL_IMAGE" "$FRONTEND_REPO"
          echo "backend_image=$BACKEND_REPO:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_REPO:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # CD 1. STAGING: Deploy Infra (Terraform)
  # ===========================================================================
  deploy-infra-staging:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.tf.outputs.alb_url }}
    outputs:
      alb_url: ${{ steps.tf.outputs.alb_url }}
      cluster: ${{ steps.tf.outputs.cluster }}
      backend_service: ${{ steps.tf.outputs.backend_service }}
      frontend_service: ${{ steps.tf.outputs.frontend_service }}
      backend_task_def: ${{ steps.tf.outputs.backend_task_def }}
      frontend_task_def: ${{ steps.tf.outputs.frontend_task_def }}
      subnets: ${{ steps.tf.outputs.subnets }}
      security_group: ${{ steps.tf.outputs.security_group }}
    defaults:
      run:
        working-directory: infra/app
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (workspace staging)
        run: |
          terraform init -input=false -backend-config=../backend.hcl
          terraform workspace select -or-create staging

      - name: Terraform Apply
        env:
          TF_VAR_environment_name: staging
          TF_VAR_backend_image_uri: ${{ needs.release.outputs.backend_image }}
          TF_VAR_frontend_image_uri: ${{ needs.release.outputs.frontend_image }}
          TF_VAR_app_version: ${{ github.sha }}
        run: terraform apply -auto-approve -input=false

      - name: Terraform Outputs
        id: tf
        run: |
          {
            echo "alb_url=$(terraform output -raw alb_url)"
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "backend_service=$(terraform output -raw backend_service_name)"
            echo "frontend_service=$(terraform output -raw frontend_service_name)"
            echo "backend_task_def=$(terraform output -raw backend_task_definition_arn)"
            echo "frontend_task_def=$(terraform output -raw frontend_task_definition_arn)"
            echo "subnets=$(terraform output -raw subnet_ids)"
            echo "security_group=$(terraform output -raw ecs_security_group_id)"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # CD 2. STAGING: Deploy App (migraciones + rolling update en ECS)
  # ===========================================================================
  deploy-app-staging:
    needs: deploy-infra-staging
    runs-on: ubuntu-latest
    outputs:
      previous_backend_task_def: ${{ steps.deploy.outputs.previous_backend_task_def }}
      previous_frontend_task_def: ${{ steps.deploy.outputs.previous_frontend_task_def }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Migraciones + despliegue en ECS
        id: deploy
        env:
          CLUSTER: ${{ needs.deploy-infra-staging.outputs.cluster }}
          BACKEND_SERVICE: ${{ needs.deploy-infra-staging.outputs.backend_service }}
          FRONTEND_SERVICE: ${{ needs.deploy-infra-staging.outputs.frontend_service }}
          BACKEND_TASK_DEF: ${{ needs.deploy-infra-staging.outputs.backend_task_def }}
          FRONTEND_TASK_DEF: ${{ needs.deploy-infra-staging.outputs.frontend_task_def }}
          SUBNETS: ${{ needs.deploy-infra-staging.outputs.subnets }}
          SECURITY_GROUP: ${{ needs.deploy-infra-staging.outputs.security_group }}
        run: bash scripts/deploy_app.sh

  # ===========================================================================
  # CD 3. Tests Pre-Prod (Staging): humo + API e2e + aceptación Selenium
  # ===========================================================================
  test-staging:
    needs: [deploy-infra-staging, deploy-app-staging]
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ needs.deploy-infra-staging.outputs.alb_url }}
      EXPECTED_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Esperar la versión nueva en Staging
        run: bash scripts/wait_for_version.sh "$APP_BASE_URL" "$EXPECTED_VERSION"

      - name: Pruebas de humo, API e2e y aceptación contra Staging
        run: |
          pytest tests/smoke tests/api tests/acceptance \
            --html=staging-report.html --self-contained-html

      - name: Upload Staging report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-report
          path: staging-report.html

  rollback-staging:
    needs: [deploy-infra-staging, deploy-app-staging, test-staging]
    if: failure() && needs.deploy-app-staging.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback automático de Staging
        env:
          CLUSTER: ${{ needs.deploy-infra-staging.outputs.cluster }}
        run: |
          echo "## Rollback automático - Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "| Servicio | Desde | Hacia | Imagen |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/rollback.sh "$CLUSTER" \
            "${{ needs.deploy-infra-staging.outputs.backend_service }}" \
            "${{ needs.deploy-app-staging.outputs.previous_backend_task_def }}"
          bash scripts/rollback.sh "$CLUSTER" \
            "${{ needs.deploy-infra-staging.outputs.frontend_service }}" \
            "${{ needs.deploy-app-staging.outputs.previous_frontend_task_def }}"

  # ===========================================================================
  # CD 4. PRODUCCIÓN: Deploy Infra (requiere aprobación manual en el ambiente)
  # ===========================================================================
  deploy-infra-production:
    needs: [release, test-staging]
    runs-on: ubuntu-latest
    environment:
      name: production # Tiene revisores requeridos: el pipeline espera la aprobación
      url: ${{ steps.tf.outputs.alb_url }}
    outputs:
      alb_url: ${{ steps.tf.outputs.alb_url }}
      cluster: ${{ steps.tf.outputs.cluster }}
      backend_service: ${{ steps.tf.outputs.backend_service }}
      frontend_service: ${{ steps.tf.outputs.frontend_service }}
      backend_task_def: ${{ steps.tf.outputs.backend_task_def }}
      frontend_task_def: ${{ steps.tf.outputs.frontend_task_def }}
      subnets: ${{ steps.tf.outputs.subnets }}
      security_group: ${{ steps.tf.outputs.security_group }}
    defaults:
      run:
        working-directory: infra/app
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (workspace production)
        run: |
          terraform init -input=false -backend-config=../backend.hcl
          terraform workspace select -or-create production

      - name: Terraform Apply (misma imagen probada en Staging)
        env:
          TF_VAR_environment_name: production
          TF_VAR_backend_image_uri: ${{ needs.release.outputs.backend_image }}
          TF_VAR_frontend_image_uri: ${{ needs.release.outputs.frontend_image }}
          TF_VAR_app_version: ${{ github.sha }}
        run: terraform apply -auto-approve -input=false

      - name: Terraform Outputs
        id: tf
        run: |
          {
            echo "alb_url=$(terraform output -raw alb_url)"
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "backend_service=$(terraform output -raw backend_service_name)"
            echo "frontend_service=$(terraform output -raw frontend_service_name)"
            echo "backend_task_def=$(terraform output -raw backend_task_definition_arn)"
            echo "frontend_task_def=$(terraform output -raw frontend_task_definition_arn)"
            echo "subnets=$(terraform output -raw subnet_ids)"
            echo "security_group=$(terraform output -raw ecs_security_group_id)"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # CD 5. PRODUCCIÓN: Deploy App
  # ===========================================================================
  deploy-app-production:
    needs: deploy-infra-production
    runs-on: ubuntu-latest
    outputs:
      previous_backend_task_def: ${{ steps.deploy.outputs.previous_backend_task_def }}
      previous_frontend_task_def: ${{ steps.deploy.outputs.previous_frontend_task_def }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Migraciones + despliegue en ECS
        id: deploy
        env:
          CLUSTER: ${{ needs.deploy-infra-production.outputs.cluster }}
          BACKEND_SERVICE: ${{ needs.deploy-infra-production.outputs.backend_service }}
          FRONTEND_SERVICE: ${{ needs.deploy-infra-production.outputs.frontend_service }}
          BACKEND_TASK_DEF: ${{ needs.deploy-infra-production.outputs.backend_task_def }}
          FRONTEND_TASK_DEF: ${{ needs.deploy-infra-production.outputs.frontend_task_def }}
          SUBNETS: ${{ needs.deploy-infra-production.outputs.subnets }}
          SECURITY_GROUP: ${{ needs.deploy-infra-production.outputs.security_group }}
        run: bash scripts/deploy_app.sh

  # ===========================================================================
  # CD 6. Tests Post-Prod: pruebas de humo (no modifican datos)
  # ===========================================================================
  smoke-test-production:
    needs: [deploy-infra-production, deploy-app-production]
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ needs.deploy-infra-production.outputs.alb_url }}
      # Para demostrar el rollback automático: crear la variable de repositorio
      # SIMULATE_SMOKE_FAILURE=true. La prueba exige una versión que no existe.
      EXPECTED_VERSION: ${{ vars.SIMULATE_SMOKE_FAILURE == 'true' && 'version-inexistente' || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Esperar la versión nueva en Producción
        run: bash scripts/wait_for_version.sh "$APP_BASE_URL" "${{ github.sha }}"

      - name: Pruebas de humo contra Producción
        run: pytest tests/smoke --html=production-smoke-report.html --self-contained-html

      - name: Upload Production report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-report
          path: production-smoke-report.html

  # ===========================================================================
  # CD 7. Rollback automático de Producción (si fallan las pruebas de humo)
  # ===========================================================================
  rollback-production:
    needs: [deploy-infra-production, deploy-app-production, smoke-test-production]
    if: failure() && needs.deploy-app-production.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback a la versión anterior
        env:
          CLUSTER: ${{ needs.deploy-infra-production.outputs.cluster }}
        run: |
          echo "## Rollback automático - Producción" >> "$GITHUB_STEP_SUMMARY"
          echo "| Servicio | Desde | Hacia | Imagen |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/rollback.sh "$CLUSTER" \
            "${{ needs.deploy-infra-production.outputs.backend_service }}" \
            "${{ needs.deploy-app-production.outputs.previous_backend_task_def }}"
          bash scripts/rollback.sh "$CLUSTER" \
            "${{ needs.deploy-infra-production.outputs.frontend_service }}" \
            "${{ needs.deploy-app-production.outputs.previous_frontend_task_def }}"

      - name: Verificar Producción después del rollback
        run: |
          curl -sf "${{ needs.deploy-infra-production.outputs.alb_url }}/api/health"
          echo
          echo "Producción quedó en la versión anterior" >> "$GITHUB_STEP_SUMMARY"
